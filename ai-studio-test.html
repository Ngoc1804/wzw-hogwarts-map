<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIZAMAP V12 · AI Studio test</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1e5ca;color:#4b3427;font:15px Georgia,serif}#status{position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center}iframe{display:block;width:100%;height:100%;border:0}button{padding:10px;margin:12px;background:#3b2925;color:#f1e5ca;border:1px solid #a58b64}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<div id="status" role="status">Đang tải WIZAMAP V12 từ GitHub qua jsDelivr…</div>
<iframe id="mapframe" title="WIZAMAP Hogwarts–Hogsmeade" sandbox="allow-scripts" hidden></iframe>
<script>
const MAP_URL="https://cdn.jsdelivr.net/gh/Ngoc1804/wzw-hogwarts-map@9e54f6af50bfb3b9c1429d36c88eed0d1eb87d7f/index.html";
async function loadMap(){
 const status=document.getElementById("status"),frame=document.getElementById("mapframe");
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);
 try{
  const response=await fetch(MAP_URL,{signal:controller.signal});
  if(!response.ok)throw Error("HTTP "+response.status);
  const html=await response.text();
  if(!html.includes("const TEMPLATES=")||!html.includes("V12"))throw Error("Nội dung tải về không phải WIZAMAP V12.");
  frame.addEventListener("load",()=>{status.hidden=true;status.style.display="none";frame.hidden=false;},{once:true});
  frame.srcdoc=html;
 }catch(error){
  status.replaceChildren();
  const title=document.createElement("strong");title.textContent="Chưa tải được WIZAMAP";
  const detail=document.createElement("pre");detail.textContent=String(error)+"\nKiểm tra kết nối hoặc quyền tải tài nguyên ngoài của Preview.";
  const retry=document.createElement("button");retry.textContent="Thử lại";retry.onclick=()=>location.reload();
  status.append(title,detail,retry);
 }finally{clearTimeout(timeout)}
}
loadMap();
</script></html>
