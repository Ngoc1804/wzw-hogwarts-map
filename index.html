<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WIZAMAP · Atlas phép thuật</title>
<style>
:root{color-scheme:light;--paper:#eee4d1;--ink:#49362b;--line:#baa585}*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--paper);color:var(--ink);font:14px Georgia,serif}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}h1{font-size:17px;letter-spacing:3px;margin:0 8px 0 0}select,button{font:inherit;color:inherit;background:#f8f0df;border:1px solid var(--line);border-radius:4px;padding:7px 10px}select{max-width:100%;min-width:180px;flex:1}nav{display:flex;gap:5px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #713b37;outline-offset:2px}main{overflow:hidden;position:relative;min-height:0}.mapmount{height:100%;width:100%}.mapmount>svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.mapmount>svg:active{cursor:grabbing}#mapmount *{animation:none!important;transition:none!important}.spot-hit{fill:transparent;stroke:transparent!important;pointer-events:all}.actor-marker{display:none}footer{min-height:42px;border-top:1px solid var(--line);padding:10px 16px;font-size:12px;line-height:1.5}#mapmount [data-id]:hover>.engraved{filter:brightness(1.06)}@media(max-width:600px){header{padding:9px;gap:8px}h1{font-size:14px}select{order:3;flex-basis:100%;width:100%}nav{margin-left:auto}footer{padding:8px}}@media print{header,footer{display:none}body{display:block}main{height:95vh}}

[hidden]{display:none!important}.mapmount.with-scroll{height:calc(100% - 21px)}
#hscroll{position:absolute;bottom:0;left:0;right:0;height:21px;overflow-x:scroll;overflow-y:hidden;background:#dfd0af;border-top:1px solid #baa585;scrollbar-color:#a08b64 #e2d3b1;scrollbar-width:auto}
#scrollspace{height:1px;pointer-events:none}
#map-range{appearance:none;position:absolute;bottom:4px;left:10px;width:calc(100% - 20px);height:13px;padding:0;margin:0;background:#dfd0af;cursor:ew-resize;border:0;border-radius:7px}
#map-range::-webkit-slider-runnable-track{height:12px;border:1px solid #b6a078;border-radius:7px;background:#e7d9b9}#map-range::-webkit-slider-thumb{appearance:none;height:12px;width:var(--thumb-size,80px);margin-top:-1px;border:1px solid #8c7754;border-radius:7px;background:#ad9871}
#map-range::-moz-range-track{height:10px;border:1px solid #b6a078;border-radius:7px;background:#e7d9b9}#map-range::-moz-range-thumb{height:10px;width:var(--thumb-size,80px);border:1px solid #8c7754;border-radius:7px;background:#ad9871}
#hscroll{scrollbar-width:none}#hscroll::-webkit-scrollbar{display:none}#hscroll::-webkit-scrollbar{height:15px}#hscroll::-webkit-scrollbar-track{background:#e2d3b1}#hscroll::-webkit-scrollbar-thumb{background:#ad9870;border:3px solid #e2d3b1;border-radius:7px}
#districts{position:absolute;right:16px;top:14px;display:flex;gap:5px;padding:5px;background:#eee4d1e8;border:1px solid #baa585;border-radius:5px}#districts{max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:flex-end}#districts button[aria-pressed="true"]{background:#d7c49d}#districts button{font-size:12px;padding:6px 10px}#mapmount [tabindex]:focus-visible{outline:none;filter:brightness(1.12)}
@media(max-width:600px){#districts{top:8px;right:8px;max-width:calc(100% - 16px)}nav button{padding:7px 8px}#read{font-size:12px}}
@media print{#hscroll,#districts{display:none!important}.mapmount.with-scroll{height:100%}}

/* Story templates: existing twelve maps retain their original layout. */
main.story-mode{display:grid;grid-template-columns:minmax(0,1fr) 294px;grid-template-rows:minmax(0,1fr)}
main.story-mode #mapmount{grid-column:1;grid-row:1;min-width:0;min-height:0;overflow:hidden}
#story-panel{grid-column:2;grid-row:1;min-height:0;overflow:auto;border-left:1px solid #bda783;padding:24px 20px;background:linear-gradient(120deg,#f5ecd7,#e9dab9);line-height:1.55}
#story-panel .eyebrow{font-size:10px;letter-spacing:2px;color:#947347;margin:0 0 9px}
#story-panel h2{font-size:24px;font-weight:normal;margin:0 0 12px;line-height:1.2}
#story-panel p{font-size:13px;margin:10px 0;color:#6b5941}
#story-tags{font:10px Georgia;letter-spacing:1px;border-block:1px solid #c7b38c;padding:9px 0;margin:16px 0}
#story-link{width:100%;margin:8px 0 16px;background:#675c43;color:#fff3d5;border:1px solid #67543a;text-align:left}
#story-find{width:100%;background:#f9f1df;border:1px solid #bda783;border-radius:3px;padding:9px;color:#55452f;font:13px Georgia}
#story-list{list-style:none;padding:0;margin:12px 0}
#story-list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #d6c6a5;border-radius:0;background:none;padding:8px 0;font-size:12px;line-height:1.4}
#story-list button:hover,#story-list button[aria-pressed=true]{color:#783f32;background:#dfcfad}
#story-list i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
#floor-nav{position:absolute;top:10px;left:12px;opacity:.96;display:flex;gap:4px;z-index:2;background:#f3e7cbeb;border:1px solid #bda783;padding:5px}
#floor-nav button{font-size:12px;padding:6px 9px}
main.story-vertical #mapmount{height:100%;padding-top:48px;overflow:auto;scrollbar-color:#a68c62 #e5d4ad;overscroll-behavior:contain}
main.story-vertical .mapmount>svg{height:auto;max-width:none;touch-action:pan-y;cursor:auto}
#mapmount .story-selected>.point-halo{stroke:#2e3025;stroke-width:4}
@media(max-width:700px){main.story-mode{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 160px}#story-panel{grid-column:1;grid-row:2;border-left:0;border-top:1px solid #bda783;padding:12px 16px}#story-panel h2{font-size:19px}#story-panel .eyebrow{margin:0}#story-panel p{margin:6px 0}#story-tags{margin:6px 0;padding:5px 0}#floor-nav{top:5px;left:5px;gap:2px;padding:3px}#floor-nav button{font-size:10px;padding:5px}main.story-mode #mapmount{min-height:0}}
@media print{#story-panel,#floor-nav{display:none!important}main.story-mode{display:block}main.story-vertical .mapmount{overflow:visible!important;height:auto!important}}
</style></head><body>

<main><nav id="floor-nav" hidden aria-label="Tầng Bộ Pháp thuật"></nav><aside id="story-panel" hidden aria-label="Thông tin địa điểm"><p class="eyebrow">WIZAMAP · ATLAS</p><h2 id="story-name"></h2><div id="story-tags"></div><p id="story-desc"></p><button id="story-link" hidden></button><label for="story-find" class="eyebrow">TÌM ĐỊA ĐIỂM</label><input id="story-find" type="search" placeholder="Tên địa điểm…" autocomplete="off"><ul id="story-list"></ul><p id="story-source"></p></aside><div id="mapmount" class="mapmount"></div><nav id="districts" hidden aria-label="Đi tới khu phố"><button id="district-diagon">Diagon</button><button id="district-knockturn">Knockturn</button></nav><div id="hscroll" hidden role="region" aria-label="Cuộn bản đồ theo chiều ngang" tabindex="0"><div id="scrollspace"></div></div><input id="map-range" type="range" min="0" max="10000" step="1" value="0" hidden aria-label="Vị trí ngang trên bản đồ"></main><footer id="status" role="status">Đang giải nén dữ liệu bản đồ cục bộ…</footer>

<script>// H1 motion hooks follow the original Demo 1 effects. Static symbol geometry is never mutated.
function mountH1Motion(svg,enabled){
 const N='http://www.w3.org/2000/svg',cam=svg.querySelector('#camera')||svg,callbacks=[],created=[];let raf=0,last=0,clock=0,previous=0,disposed=false;
 const make=(tag,a,p=cam)=>{const e=document.createElementNS(N,tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);p.append(e);return e};
 const G=(p,a={})=>make('g',a,p),P=(p,d,a={})=>make('path',{d,fill:'none',stroke:'#9c9277','stroke-width':1,...a},p),cycle=(t,d,delay=0)=>((t-delay)%d+d)%d/d;
 function rotate(e,amplitude,duration,pivot,delay=0){if(!e)return;e.style.removeProperty('transform');e.style.removeProperty('transform-origin');e.style.removeProperty('transform-box');const base=e.getAttribute('transform')||'',b=e.getBBox(),x=pivot?.[0]??b.x+b.width/2,y=pivot?.[1]??b.y+b.height;callbacks.push(t=>e.setAttribute('transform',base+` rotate(${Math.sin((t+delay)/duration*2*Math.PI)*amplitude} ${x} ${y})`))}
 function smoke(parent,x,y,scale=1){const wrap=G(parent,{transform:`translate(${x} ${y}) scale(${scale})`,'data-live-effect':'smoke','pointer-events':'none'});created.push(wrap);for(let i=0;i<4;i++){const g=G(wrap);P(g,'M0 0C-15-10 14-20 0-33C-12-44 15-48 5-60',{stroke:'#8a8375','stroke-width':5,'stroke-linecap':'round'});callbacks.push(t=>{const f=cycle(t,5,i*1.25);g.setAttribute('transform',`translate(${f*13} ${-f*36}) scale(${.35+f*.9})`);g.setAttribute('opacity',Math.sin(f*Math.PI)*.38)})}}
 // Remove inert frame captures of effects replaced by the controlled live layers.
 for(const e of [...svg.querySelectorAll('.v12-smoke-layer,[data-effect="village-smoke"],[data-effect="boathouse-rope"]')])e.remove();
 for(const e of svg.querySelectorAll('[data-emitter="chimney"]'))smoke(e,0,0,.55);
 for(const e of svg.querySelectorAll('[data-effect="train-smoke"],[data-effect="train-steam"]')){e.replaceChildren();smoke(e,0,0,.9)}
 for(const [i,e]of [...svg.querySelectorAll('.cloth')].entries()){
  const first=(e.getAttribute('d')||'').match(/^M\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/);if(!first)continue;const x=+first[1],y=+first[2],w=Math.max(12,e.getBBox().width);e.style.removeProperty('transform');
  callbacks.push(t=>{const a=Math.sin(t*3.4+i*.5)*4;e.setAttribute('d',`M${x} ${y}C${x+w*.4} ${y+a} ${x+w*.6} ${y-a} ${x+w} ${y+2}L${x+w} ${y+10}C${x+w*.6} ${y+8-a} ${x+w*.4} ${y+8+a} ${x} ${y+8}Z`)})
