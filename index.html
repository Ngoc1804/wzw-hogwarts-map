:root{color-scheme:light;--paper:#eee4d1;--ink:#49362b;--line:#baa585}*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--paper);color:var(--ink);font:14px Georgia,serif}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}h1{font-size:17px;letter-spacing:3px;margin:0 8px 0 0}select,button{font:inherit;color:inherit;background:#f8f0df;border:1px solid var(--line);border-radius:4px;padding:7px 10px}select{max-width:100%;min-width:180px;flex:1}nav{display:flex;gap:5px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #713b37;outline-offset:2px}main{overflow:hidden;position:relative;min-height:0}.mapmount{height:100%;width:100%}.mapmount>svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.mapmount>svg:active{cursor:grabbing}#mapmount *{animation:none!important;transition:none!important}.spot-hit{fill:transparent;stroke:transparent!important;pointer-events:all}.actor-marker{display:none}footer{min-height:42px;border-top:1px solid var(--line);padding:10px 16px;font-size:12px;line-height:1.5}#mapmount [data-id]:hover>.engraved{filter:brightness(1.06)}@media(max-width:600px){header{padding:9px;gap:8px}h1{font-size:14px}select{order:3;flex-basis:100%;width:100%}nav{margin-left:auto}footer{padding:8px}}@media print{header,footer{display:none}body{display:block}main{height:95vh}}

#hscroll{position:absolute;bottom:0;left:0;right:0;height:21px;overflow-x:scroll;overflow-y:hidden;background:#dfd0af;border-top:1px solid #baa585;scrollbar-color:#a08b64 #e2d3b1;scrollbar-width:auto}

 const r=svg.getBoundingClientRect(),aspect=r.width/Math.max(1,r.height),lower=which==='knockturn',h=lower?1900:1700,w=Math.max(1450,h*aspect);
 box=[lower?3000:60,lower?1400:0,w,w/aspect];setBox();
}
function zoom(f,cx=.5,cy=.5){const w=box[2]*f,h=box[3]*f;if(w<baseBox[2]/16||w>baseBox[2]*3)return;box=[box[0]+(box[2]-w)*cx,box[1]+(box[3]-h)*cy,w,h];setBox()}
function selectPlace(id){const p=maps[currentKey].places?.find(x=>x.id===id),title=svg.querySelector('[data-id="'+CSS.escape(id)+'"] title')?.textContent;q('#status').textContent=p?p.name+(p.desc?' · '+p.desc:''):(title||maps[currentKey].title)}
function openMap(key){
 stopH1Motion();stopH1Motion=()=>{};
 if(frame){cancelAnimationFrame(frame);frame=0}currentKey=key;const data=maps[key];q('#mapmount').innerHTML=data.svg;svg=q('#mapmount>svg');
 const ids=new Set([...data.svg.matchAll(/#(wm-s\d+)/g)].map(m=>m[1]));
 if(ids.size){const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');defs.innerHTML=[...ids].map(id=>vectors[id]||'').join('');svg.prepend(defs)}
 q('#scene-motion').hidden=key!=='h1';
 if(key==='h1')stopH1Motion=mountH1Motion(svg,()=>motionEnabled&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches);
 svg.setAttribute('role','img');svg.setAttribute('aria-label',data.title);svg.setAttribute('preserveAspectRatio','xMidYMid meet');
 baseBox=data.bounds||svg.getAttribute('viewBox').trim().split(/[ ,]+/).map(Number);
 q('#read').hidden=!data.reading;q('#fit').textContent=data.reading?'Toàn cảnh':'Vừa khung';q('#districts').hidden=key!=='diagon-knockturn';q('#mapmount').classList.toggle('with-scroll',Boolean(data.reading));
 if(data.reading)readView();else fit();q('#maps').value=key;
 q('#status').textContent=data.title+(data.reading?' · Kéo để khám phá; thanh cuộn bên dưới di chuyển ngang.':' · Kéo để di chuyển; dùng + / − hoặc cuộn để phóng to.');
 let drag=null,moved=false;
 svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,box:[...box]};moved=false});
 svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4){moved=true;if(!svg.hasPointerCapture(e.pointerId))svg.setPointerCapture(e.pointerId)}if(!moved)return;const r=svg.getBoundingClientRect(),s=Math.min(r.width/drag.box[2],r.height/drag.box[3]);box=[drag.box[0]-dx/s,drag.box[1]-dy/s,drag.box[2],drag.box[3]];setBox()});
 const release=()=>{drag=null};for(const type of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(type,release);svg.addEventListener('pointerleave',e=>{if(!svg.hasPointerCapture(e.pointerId))release()});
 svg.addEventListener('click',e=>{if(moved)return;const id=e.target.closest('[data-id]')?.dataset.id;if(id)selectPlace(id)});
 svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const id=e.target.closest('[data-id]')?.dataset.id;if(id){e.preventDefault();selectPlace(id)}}});
 svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),s=Math.min(r.width/box[2],r.height/box[3]);if(wide()&&(e.shiftKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))){box[0]+=(e.deltaX||e.deltaY)/s;setBox();return}zoom(e.deltaY<0?.9:1.1,(e.clientX-r.left-(r.width-box[2]*s)/2)/(box[2]*s),(e.clientY-r.top-(r.height-box[3]*s)/2)/(box[3]*s))},{passive:false});
}
function downloadAtlas(){
 const copy=document.documentElement.cloneNode(true);copy.querySelector('#mapmount').replaceChildren();copy.querySelector('#mapmount').classList.remove('with-scroll');
 const menu=copy.querySelector('#maps'),option=document.createElement('option');option.textContent='Đang mở bản đồ…';menu.replaceChildren(option);menu.disabled=true;
 for(const id of ['districts','hscroll','map-range','read'])copy.querySelector('#'+id).hidden=true;
 copy.querySelector('#scene-motion').textContent='Chuyển động: bật';copy.querySelector('#scene-motion').setAttribute('aria-pressed','true');copy.querySelector('#fit').textContent='Vừa khung';copy.querySelector('#status').textContent='Đang giải nén dữ liệu bản đồ cục bộ…';
 const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='wizamap.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
q('#download-html').onclick=downloadAtlas;
q('#scene-motion').onclick=()=>{motionEnabled=!motionEnabled;q('#scene-motion').textContent='Chuyển động: '+(motionEnabled?'bật':'tắt');q('#scene-motion').setAttribute('aria-pressed',String(motionEnabled))};
(async()=>{try{
 const bytes=Uint8Array.from(atob(q('#map-data').textContent.trim()),c=>c.charCodeAt(0)),payload=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());maps=payload.maps;vectors=payload.vectors||{};
 q('#maps').replaceChildren(...Object.entries(maps).map(([key,m])=>{const o=document.createElement('option');o.value=key;o.textContent=m.title;return o}));q('#maps').disabled=false;q('#maps').onchange=e=>openMap(e.target.value);
 q('#in').onclick=()=>zoom(1/1.2);q('#out').onclick=()=>zoom(1.2);q('#fit').onclick=fit;q('#read').onclick=readView;q('#district-diagon').onclick=()=>focusDistrict('diagon');q('#district-knockturn').onclick=()=>focusDistrict('knockturn');
 q('#map-range').addEventListener('input',e=>{box[0]=baseBox[0]+Number(e.target.value)/10000*Math.max(0,baseBox[2]-box[2]);setBox()});
 q('#hscroll').addEventListener('scroll',()=>{if(!wide()||!box)return;const t=q('#hscroll'),max=t.scrollWidth-t.clientWidth;if(max<1)return;const x=baseBox[0]+t.scrollLeft/max*Math.max(0,baseBox[2]-box[2]);if(Math.abs(x-box[0])>.5){box[0]=x;setBox()}});
 new ResizeObserver(()=>{if(svg&&box)scrollSync()}).observe(q('#mapmount'));openMap('h1');
}catch(e){q('#status').textContent='Không mở được bản đồ: '+e.message;console.error(e)}})();
</script></body></html>
